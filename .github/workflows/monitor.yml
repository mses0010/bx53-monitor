name: BX-53 Monitor

on:
  schedule:
    - cron: '*/1 * * * *' # 每 1 分鐘自動觸發一次
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4

      - name: Run script
        run: |
          python monitor.py